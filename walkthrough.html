<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小车调试助手 - 软件演示</title><style>body{margin:0;background:#e9edf4;color:#20314a;font:14px "Microsoft YaHei",sans-serif}main{max-width:1280px;margin:24px auto;padding:0 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}h1{font-size:22px;margin:0 0 8px}p{color:#5b6c83;margin:8px 0;line-height:1.8}canvas{width:100%;height:auto;display:block;background:white;box-shadow:0 10px 35px #22335516;border-radius:12px}button,a{font:inherit;padding:10px 15px;background:white;color:#244d91;border:1px solid #c7d4e6;border-radius:8px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}button.primary{background:#245fda;color:white}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#progress{padding:13px;background:#f6f9ff;border-radius:8px}small{color:#66788e}</style></head><body><main><header><div><h1>软件功能演示</h1><p>此视图调用与主界面相同的诊断接口。场景数据均为人工构造。</p></div><a href="/">返回调试界面</a></header><canvas id="screen" width="1920" height="1080" aria-label="软件运行结果演示画面"></canvas><div class="controls"><button class="primary" id="record">录制44秒演示</button><button id="downloadVideo" disabled>下载已录制视频</button><button id="stale">查看过期示例</button><button id="recovery">查看恢复示例</button><button id="save">保存当前画面PNG</button></div><p id="progress" role="status">正在准备示例…</p><small>视频由本软件的Canvas演示视图直接录制，所有诊断结果来自实际规则运行。它不是实车录像，也不表示已经完成硬件验收。导出约44秒，1920×1080，无配音。</small></main><script src="/walkthrough.js"></script></body></html>
